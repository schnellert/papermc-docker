name: Synchronize

on:
  workflow_call:
    inputs:
      force:
        required: true
        type: boolean
      project:
        required: true
        type: string

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      any: ${{ steps.detect-changes.outputs.any }}
      matrix: ${{ steps.detect-changes.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: schnellert
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Detect Changes
        id: detect-changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FORCE: ${{ inputs.force }}
          PROJECT: ${{ inputs.project }}
        with:
          script: |
            const fs        = require('fs');

            const force     = process.env.FORCE === 'true';
            const project   = process.env.PROJECT;

            const FILL_API_BASE_URL  = 'https://fill.papermc.io/v3';
            const namespace = 'schnellert';

            const fetchJson = async (url, label) => {
              const res = await fetch(url);
              if (!res.ok) {
                throw new Error(`Failed to fetch ${label}: ${res.status} ${res.statusText}`);
              }
              return res.json();
            };

            const pickStableBuild = builds =>
              builds.find(b => b.channel === 'STABLE' || b.channel === 'RECOMMENDED');

            const { versions: versionsByFamily } =
              await fetchJson(`${FILL_API_BASE_URL}/projects/${project}`, project);

            const missing = [];

            for (const [family, candidates] of Object.entries(versionsByFamily)) {
              let version;
              let build;
              let latest;

              // Families are newest-first; take the first candidate that has a stable build.
              for (const candidate of candidates) {
                const builds = await fetchJson(
                  `${FILL_API_BASE_URL}/projects/${project}/versions/${candidate}/builds`,
                  `${project} ${candidate} builds`,
                );

                latest ??= { candidate, build: builds[0] };

                build = pickStableBuild(builds);

                if (build) {
                  version = candidate;
                  break;
                }
              }

              // No stable build anywhere (e.g. a fresh version still tagged unstable) — use the newest build.
              if (!build && latest?.build) {
                ({ candidate: version, build } = latest);
              }

              if (!build) {
                continue;
              }

              const tag       = `${version}-build.${build.id}`;
              const reference = `docker.io/${namespace}/${project}:${tag}`;

              if (!force) {
                const { exitCode } = await exec.getExecOutput(
                  'docker', ['buildx', 'imagetools', 'inspect', reference],
                  { ignoreReturnCode: true, silent: true },
                );
                if (exitCode === 0) {
                  continue;
                }
              }

              const asset = build.downloads['server:default'];
              if (!asset?.url) {
                throw new Error(`No download URL for ${project} ${version} build ${build.id}`);
              }
              if (!asset.checksums?.sha256) {
                throw new Error(`No SHA256 for ${project} ${version} build ${build.id}`);
              }

              const { version: { java } } = await fetchJson(
                `${FILL_API_BASE_URL}/projects/${project}/versions/${version}`,
                `${project} ${version}`,
              );

              const dockerfile = `${project}/Dockerfile.java${java.version.minimum}`;
              if (!fs.existsSync(dockerfile)) {
                core.info(`No ${dockerfile} found (${tag}) — skipping`);
                continue;
              }

              missing.push({
                download: asset.url,
                sha256:   `sha256:${asset.checksums.sha256}`,
                java:     java.version.minimum,
                tag,
                version,
              });
            }

            core.setOutput('matrix', JSON.stringify({ include: missing }));
            core.setOutput('any',    String(missing.length > 0));

            core.info(
              missing.length > 0
                ? `${missing.length} ${missing.length === 1 ? 'image needs' : 'images need'} building:\n${JSON.stringify(missing, null, 2)}`
                : 'All images are up to date.',
            );

  build-push:
    name: Build & Push
    runs-on: ubuntu-latest

    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.any == 'true' }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
      max-parallel: 3

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate with GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: schnellert
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate with Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: schnellert
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Setup Docker QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Build & Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            DOWNLOAD_URL=${{ matrix.download }}
            SHA256_CHECKSUM=${{ matrix.sha256 }}
          cache-from: |
            type=gha,scope=${{ inputs.project }}-java${{ matrix.java }}
          cache-to: |
            type=gha,mode=max,scope=${{ inputs.project }}-java${{ matrix.java }}
          context: ${{ inputs.project }}
          file: ${{ inputs.project }}/Dockerfile.java${{ matrix.java }}
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ inputs.project }}:${{ matrix.tag }}
            ghcr.io/${{ github.repository }}/${{ inputs.project }}:${{ matrix.version }}
            schnellert/${{ inputs.project }}:${{ matrix.tag }}
            schnellert/${{ inputs.project }}:${{ matrix.version }}
